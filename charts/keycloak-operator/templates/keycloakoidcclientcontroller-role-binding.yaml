{{- if not .Values.watchAllNamespaces -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    {{- include "shared-library.labels" . | nindent 4 }}
  name: {{ include "shared-library.fullname" . }}-oidcclientcontroller-role-binding
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  apiGroup: rbac.authorization.k8s.io
  name: {{ include "shared-library.fullname" . }}-oidcclientcontroller-cluster-role
subjects:
  - kind: ServiceAccount
    name: {{ include "shared-library.serviceAccountName" . }}
{{- end -}}