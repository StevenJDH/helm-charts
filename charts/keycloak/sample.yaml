          image: "quay.io/keycloak/keycloak:26.3.3"
          imagePullPolicy: Always
          ports:
          command:
            - /opt/keycloak/bin/kc.sh
          args:
            - "start-dev"
          envFrom:
          - configMapRef:
              name: example-keycloak-config
      restartPolicy: Always
      nodeSelector:
        kubernetes.io/os: linux
