apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-keycloak
  annotations:
    rollme: "494FZ"
  labels:
    helm.sh/chart: keycloak-0.1.0
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/instance: example
    app.kubernetes.io/version: "26.3.3"
