apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: keycloak
  namespace: {{ .Release.Namespace }}
spec:
  bootstrapAdmin:
    user:
      secret: keycloak-bootstrap-admin
  db:
    vendor: postgres
    host: my-postgresql-hl
    database: keycloak2
    port: 5432
    passwordSecret:
      name: my-postgresql
      key: postgres-password
    schema: public
    poolInitialSize: 1
    poolMinSize: 2
    poolMaxSize: 30
  http:
    httpEnabled: true
  hostname:
    hostname: http://keycloak.127.0.0.1.sslip.io
    strict: false
  serviceMonitor:
    enabled: false
  env:
    - name: KC_DB_USERNAME
      value: postgres