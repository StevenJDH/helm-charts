{{- $requiredMsg := include "shared-library.required-msg" . -}}

apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: {{ include "shared-library.fullname" . }}
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "shared-library.labels" . | nindent 4 }}
  namespace: {{ .Release.Namespace }}
spec:
  bootstrapAdmin:
    {{- if .Values.bootstrapAdmin.user.username }}
    user:
      secret: {{ template "shared-library.fullname" . }}-secret
    {{- end }}
    {{- if .Values.bootstrapAdmin.service.clientId }}
    service:
      secret: {{ template "shared-library.fullname" . }}-secret
    {{- end }}
  db:
    vendor: {{ .Values.postgresql.enabled | ternary (.Values.db.vendor | default "postgres") .Values.db.external.vendor }}
    host: {{ .Values.postgresql.enabled | ternary (.Values.db.hostOverride | default (printf "%s-%s.%s.svc.cluster.local" .Release.Name "keycloak-postgresql-hl" .Release.Namespace)) .Values.db.external.host }}
    database: {{ .Values.postgresql.enabled | ternary .Values.postgresql.auth.database .Values.db.external.database }}
    port: {{ .Values.postgresql.enabled | ternary .Values.db.port .Values.db.external.port }}
    usernameSecret:
      name: {{ template "shared-library.fullname" . }}-secret
      key: db-username
    {{- if .Values.postgresql.enabled }}
    passwordSecret:
      name: {{ .Release.Name }}-keycloak-postgresql
      key: postgres-password
    {{- else }}
    passwordSecret:
      name: {{ template "shared-library.fullname" . }}-secret
      key: db-password
    {{- end }}
    schema: {{ .Values.postgresql.enabled | ternary .Values.db.schema .Values.db.external.schema }}
    {{- with .Values.db.poolInitialSize }}
    poolInitialSize: {{ . }}
    {{- end }}
    {{- with .Values.db.poolMinSize }}
    poolMinSize: {{ . }}
    {{- end }}
    {{- with .Values.db.poolMaxSize }}
    poolMaxSize: {{ . }}
    {{- end }}
  transaction:
    xaEnabled: false
  http:
    httpEnabled: {{ .Values.devModeEnabled }}
    serviceName: ""    # overrides the default "example-kc-service"
    labels: {}
    annotations: {}
    httpPort: 8080
    httpsPort: 8443
    tlsSecret: my-tls-secret
  hostname:
    hostname: {{ .Values.hostname.host }}
    strict: {{ .Values.devModeEnabled | ternary false true }}
  proxy:
    headers: xforwarded
  features: {}
  serviceMonitor:
    enabled: false # prevents creation when metrics-enabled is true.
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
    annotations: {}
  {{- with .Values.extraEnvs }}
  env: 
    {{- toYaml . | nindent 4 }}
  {{- end }}
  resources:
    requests:
      cpu: 1200m
      memory: 896Mi
    limits:
      cpu: 6
      memory: 3Gi
  readinessProbe:
    periodSeconds: 20
    failureThreshold: 5
  livenessProbe:
    periodSeconds: 20
    failureThreshold: 5
  startupProbe:
    periodSeconds: 20
    failureThreshold: 5
  scheduling: {}
  update: {}
  networkPolicy:
    enabled: {{ .Values.networkPolicy.enabled }}
    {{- with .Values.networkPolicy.http }}
    http:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.networkPolicy.https }}
    https:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.networkPolicy.https }}
    management:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- with .Values.truststores }}
  truststores:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  tracing:
    enabled: {{ .Values.tracing.enabled }}
    compression: {{ .Values.tracing.compression }}
    endpoint: {{ .Values.tracing.endpoint }}
    protocol: {{ .Values.tracing.protocol }}
    samplerRatio: {{ .Values.tracing.samplerRatio }}
    samplerType: {{ .Values.tracing.samplerType }}
  telemetry:
    enabled: {{ .Values.telemetry.enabled }}
    endpoint: {{ .Values.telemetry.endpoint }}
    serviceName: {{ .Values.telemetry.serviceName | quote }}
    {{- with .Values.telemetry.resourceAttributes }}
    resourceAttributes:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  additionalOptions:
    - name: metrics-enabled
      value: {{ .Values.metrics.enabled | quote }}
    - name: telemetry-metrics-enabled
      value: {{ .Values.telemetry.enabled | quote }}
    {{- with .Values.additionalOptions }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.podTemplate }}
  unsupported:
    podTemplate:
      {{- toYaml . | nindent 6 }}
  {{- end }}