apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: my-keycloak-stack-service
  namespace: keycloak
spec:
  entryPoints:
    - websecure
  routes:
    - match: HostSNI(`keycloak.127.0.0.1.sslip.io`)
      services:
        - name: my-keycloak-stack-service
          port: 8443
  tls:
    passthrough: true
