bootstrapAdmin:
  user:
    username: admin
    password: admin

http:
  # Needs to be enabled to allow ingress controller to container traffic.
  httpEnabled: true

hostname:
  host: "keycloak.127.0.0.1.sslip.io"

devModeEnabled: false

proxy:
  # Valid values are 'forwarded' and 'xforwarded'.
  headers: xforwarded

# See README for how to create certificates to test with.
# Reference: https://github.com/StevenJDH/helm-charts/tree/main/charts/keycloak-stack#creating-server-certificates-for-tls-scenarios
ingress:
  className: traefik
  # Use this if you already have an existing tls secret for the above hostname.
  tlsSecret: ""
  tls:
    certContent: ""
    # certContent: |
    #   -----BEGIN CERTIFICATE-----
    #   ...server
    #   -----END CERTIFICATE-----
    #   -----BEGIN CERTIFICATE-----
    #   ...CA
    #   -----END CERTIFICATE-----

    keyContent: ""
    # keyContent: |
    #   -----BEGIN PRIVATE KEY-----
    #   ...
    #   -----END PRIVATE KEY-----

postgresql:
  auth:
    password: password