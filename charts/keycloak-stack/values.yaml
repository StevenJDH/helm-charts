# -- replicaCount is the number of pod instances created by the Deployment owned ReplicaSet to
# increase availability when set to more than one.
replicaCount: 1

image:
  # -- repository holding the container image.
  repository: "quay.io/keycloak/keycloak"
  # -- pullPolicy is the strategy for pulling images from a registry.
  pullPolicy: Always
  # -- Overrides the image tag whose default is the chart appVersion.
  tag: ""
  pullSecret:
    # @ignored. registry is the private docker container registry for pulling images.
    registry: "index.docker.io/v1/"
    # -- username is the Docker username associated with the password.
    username: ""
    # -- password is the Docker password associated with the username with pull rights.
    password: ""

# -- Override for chart name in helm common labels.
nameOverride: ""
# -- Override for generated resource names.
fullnameOverride: ""

bootstrapAdmin:
  user:
    # -- username is the username for the Keycloak bootstrap admin user.
    username: admin
    # -- password is the password for the Keycloak bootstrap admin user.
    password: admin
  service:
    # -- clientId is the client ID for the Keycloak bootstrap admin service account.
    clientId: ""
    # -- clientSecret is the client secret for the Keycloak bootstrap admin service account.
    clientSecret: ""

hostname:
  # -- host is the hostname for the Keycloak server. Applicable for Hostname v1 and v2.
  host: "keycloak.127.0.0.1.sslip.io"
  # -- strict indicates whether the hostname should be treated as strict. This dynamically
  # resolves the hostname from request headers. Applicable for Hostname v1 and v2.
  strict: true

db:
  # -- vendor is the database vendor to use for Keycloak. Supported values are: postgres, mariadb,
  # mysql, oracle, mssql, etc. This setting is ignored if `postgresql.enabled` is `false`.
  vendor: postgres
  # -- hostOverride is the hostname of the database server. If not set, it will be auto configured for
  # the postgresql headless service of the managed database. This setting is ignored if
  # `postgresql.enabled` is `false`.
  hostOverride: ""
  # -- port is the port number of the database server. This setting is ignored if `postgresql.enabled`
  # is `false`.
  port: 5432
  # -- schema is the name of the database schema to use for Keycloak. This setting is ignored if
  # `postgresql.enabled` is `false`.
  schema: public
  # -- poolInitialSize is the initial number of connections that are created when the pool is started.
  poolInitialSize: 1
  # -- poolMinSize is the minimum number of connections that are maintained in the pool.
  poolMinSize: 2
  # -- poolMaxSize is the maximum number of connections that can be allocated from the pool at a given time.
  poolMaxSize: 30
  external:
    # -- vendor is the external database vendor to use for Keycloak. Supported values are: postgres, mariadb,
    # mysql, oracle, mssql, etc. This setting is ignored if `postgresql.enabled` is `true`.
    vendor: postgres
    # -- host is the hostname of the external database server. This setting is ignored if
    # `postgresql.enabled` is `true`.
    host: ""
    # -- database is the name of the external database to use for Keycloak. This setting is ignored if
    # `postgresql.enabled` is `true`.
    database: "keycloak"
    # -- port is the port number of the external database server. This setting is ignored if
    # `postgresql.enabled` is `true`.
    port: 5432
    # -- schema is the name of the external database schema to use for Keycloak. This setting is ignored
    # if `postgresql.enabled` is `true`.
    schema: public
    auth:
      # -- username is the username for the external database user. This setting is ignored if
      # `postgresql.enabled` is `true`.
      username: ""
      # -- password is the password for the external database user. This setting is ignored if
      # `postgresql.enabled` is `true`.
      password: ""

# -- Indicates whether or not Keycloak is running in development mode. This will disable features and
# configurations that are only suitable for development environments.
devModeEnabled: false

serviceAccount:
  # -- Specifies whether a service account should be created.
  create: true
  # -- annotations to be added to the Service Account resource.
  annotations: {}
  # -- The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""
  
# -- annotations to be added to the Deployment resource.
annotations: {}

# -- restartPolicy defines how a pod will automatically repair itself when a problem arises.
# Reference [Container restart policy](https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/#restart-policy).
restartPolicy: Always

# -- The update strategy to apply to the Deployment resource.
updateStrategy: {}
  # rollingUpdate:
  #   maxUnavailable: 1
  # type: RollingUpdate

# -- Additional environment variables to set for the Keycloak server. These should be expressed as key-value pairs that
# can be either direct values or references to secrets.. Use the `additionalOptions` section for first-class options
# rather than KC_ values here.
extraEnvs: []
# - name: FOO
#   value: bar
# - name: FOO
#   secret:
#     key: FOO
#     name: secret-resource
#     optional: false

features: {}
  # enabled:
  #   - docker
  #   - authorization
  # disabled:
  #   - admin
  #   - step-up-authentication

# -- truststores is used to configure the Keycloak truststores using Secrets or ConfigMaps containing PEM encoded
# files, or PKCS12 files with extension .p12, .pfx, or .pkcs12.
# See [Truststores](https://www.keycloak.org/operator/advanced-configuration#_truststores) for more information.
truststores: {}
  # my-truststore:
  #   secret:
  #     name: my-secret
  # my-truststore2:
  #   configMap:
  #     name: my-config

metrics:
  # -- Indicates whether or not Keycloak metrics should be enabled. Before enabling this, make sure
  # `serviceMonitor.enabled` is set `false`, otherwise, a ServiceMonitor resource will also be created.
  enabled: false

tracing:
  # -- Indicates whether or not to enable OpenTelemetry tracing. Requires `metrics.enabled` to be `true`.
  enabled: false
  # -- compression is the OpenTelemetry method used to compress payloads. Possible values are: gzip, none.
  compression: none
  # -- endpoint is the OpenTelemetry endpoint to connect to.
  endpoint: "http://otel-collector:4317"
  # -- protocol is the OpenTelemetry protocol used for the transmitting the data.
  protocol: "grpc"
  # -- samplerRatio is the OpenTelemetry sampler ratio. Probability that a span will be sampled using a
  # double type value. For example, 1.0 is equal to 100%.
  samplerRatio: 0.1
  # -- samplerType is the OpenTelemetry sampler to use for tracing.
  samplerType: "traceidratio"

telemetry:
  # -- Indicates whether or not to enable OpenTelemetry metrics. Requires `metrics.enabled` to be
  # `true`, and `features` to include `opentelemetry-metrics:v1`.
  enabled: false
  # -- endpoint is the OpenTelemetry endpoint to connect to.
  endpoint: "http://otel-collector:4317"
  # -- serviceName is the OpenTelemetry service name. Takes precedence over 'service.name' defined in
  # `telemetry.resourceAttributes`.
  serviceName: ""
  # -- resourceAttributes is the OpenTelemetry resource attributes present in the exported telemetry
  # data to characterize the telemetry producer.
  resourceAttributes: {}
    # service.namespace: keycloak
    # deployment.environment: test

# -- Additional options to set for the Keycloak server. These should be expressed as key-value pairs that can be either
# direct values or references to secrets. Use quotes for numbers and boolean values. Do not set `metrics-enabled` and
# `telemetry-metrics-enabled` as these will be added when needed automatically.
# See [All configuration](https://www.keycloak.org/server/all-config) for details.
additionalOptions: []
# - name: http-relative-path
#   value: "/"
# - name: log-console-level
#   secret:
#     name: my-logging-config
#     key: log-console-level

# -- podTemplate is a raw API representation that is used for the Deployment Template. This field is a temporary
# workaround in case no supported field exists at the top level of the CR for a use case. However, no guarantee
# exists that the Deployment will work as expected.
podTemplate: {}
  # metadata:
  #   labels:
  #     my-label: "keycloak"
  # spec:
  #   containers:
  #     - volumeMounts:
  #         - name: test-volume
  #           mountPath: /mnt/test
  #   volumes:
  #     - name: test-volume
  #       secret:
  #         secretName: keycloak-additional-secret

# -- priorityClassName is the name of the PriorityClass resource that indicates the
# importance of a Pod relative to other Pods. If a Pod cannot be scheduled, the
# scheduler tries to preempt (evict) lower priority Pods to make scheduling of the
# pending Pod possible.
# Reference [Pod Priority and Preemption](https://kubernetes.io/docs/concepts/scheduling-eviction/pod-priority-preemption).
priorityClassName: ""

# -- containerPort is the port or ports that the container listens on.
containerPorts: {}
  # http: 8080
  # actuator: 8081

# @ignored. Startup, Liveness and readiness probes. Liveness probes do not wait
# for readiness probes to succeed. If you want to wait before executing a liveness
# probe you should use initialDelaySeconds or a startupProbe.
# Reference [Configure Liveness, Readiness and Startup Probes](https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes).
health:
  startupProbe: {}
    # httpGet:
    #   path: /actuator/health
    #   port: actuator
    #   scheme: HTTP
    # initialDelaySeconds: 5
    # periodSeconds: 5
    # timeoutSeconds: 2
    # successThreshold: 1
    # failureThreshold: 5
  livenessProbe: {}
    # httpGet:
    #   path: /actuator/health/liveness
    #   port: actuator
    #   scheme: HTTP
    # initialDelaySeconds: 10
    # periodSeconds: 10
    # timeoutSeconds: 1
    # successThreshold: 1
    # failureThreshold: 5
  readinessProbe: {}
    # httpGet:
    #   path: /actuator/health/readiness
    #   port: actuator
    #   scheme: HTTP
    # initialDelaySeconds: 10
    # periodSeconds: 10
    # timeoutSeconds: 1
    # successThreshold: 1
    # failureThreshold: 3

service:
  # -- type specifies what kind of Service resource to create.
  type: ClusterIP
  # @ignored
  port: 80
  # @ignored
  targetPort: &targetPort 8080
  # @ignored
  nodePort: 32080
  # -- appProtocol overrides annotations in a service resource that were used for setting a backend protocol. In AWS for example,
  # `service.beta.kubernetes.io/aws-load-balancer-backend-protocol: http`. See the following GitHub issue for more details
  # [kubernetes/kubernetes#40244](https://github.com/kubernetes/kubernetes/issues/40244). Will be ignored for Kubernetes versions
  # older than 1.20.
  appProtocol: true
  # -- annotations to be added to the Service resource.
  annotations: {}
  # -- clusterIP allows for customizing the cluster IP address of a service resource.
  clusterIP: ""
  # -- externalIPs is a list of IP addresses at which a service is available at.
  # Reference [External IPs](https://kubernetes.io/docs/user-guide/services/#external-ips).
  externalIPs: []
  # -- loadBalancerIP is a field used by cloud providers to connect the resulting `LoadBalancer` created by a service resource to a
  # pre-existing static IP. This field is deprecated as of Kubernetes 1.24.0 since it doesn't support dual-stack, but there is no
  # replacement as of yet. Most likely cloud providers will adopt a provider specific annotation approach for this. Progress can be
  # tracked here [kubernetes/enhancements#1992](https://github.com/kubernetes/enhancements/pull/1992).
  # Reference [Type LoadBalancer](https://kubernetes.io/docs/concepts/services-networking/service/#loadbalancer).
  loadBalancerIP: ""
  # -- loadBalancerSourceRanges is a list of one or more internal or external IP address ranges. If not set, a Service will accept
  # traffic from any IP address (0.0.0.0/0).
  loadBalancerSourceRanges: []
  # -- externalTrafficPolicy is an annotation set on a service resource. It defines how traffic incoming to a node is load balanced.
  # `Cluster` is normally the default policy, but `Local` is often used to preserve the source IP of traffic coming into a cluster
  # node. With Local, requests are load balanced equally across nodes irrespective of how many pods are on each node. When set to
  # Cluster, both nodes and pods are taken into consideration. Applicable only when `service.type` is `NodePort` or `LoadBalancer`.
  # Reference [Preserving the client source IP](https://kubernetes.io/docs/tasks/access-application-cluster/create-external-load-balancer/#preserving-the-client-source-ip).
  externalTrafficPolicy: ""
  # -- sessionAffinity ensures that connections from a particular client are passed to the same Pod each time based on the client's
  # IP address. Must be either "None" or "ClientIP" if set.
  # Reference [User space proxy mode](https://kubernetes.io/docs/concepts/services-networking/service/#proxy-mode-userspace).
  sessionAffinity: "None"
  # -- healthCheckNodePort specifies the health check node port (numeric port number) for the service. If healthCheckNodePort isn’t specified,
  # the service controller allocates a port from your cluster’s NodePort range.
  # Reference [Preserving the client source IP](https://kubernetes.io/docs/tasks/access-application-cluster/create-external-load-balancer/#preserving-the-client-source-ip).
  healthCheckNodePort: 0
  # -- ipFamilyPolicy represents the dual-stack-ness requested or required by this Service. Possible values are SingleStack, PreferDualStack or RequireDualStack.
  # The ipFamilies and clusterIPs fields depend on the value of this field.
  # Reference [IPv4/IPv6 dual-stack](https://kubernetes.io/docs/concepts/services-networking/dual-stack).
  ipFamilyPolicy: "SingleStack"
  # -- ipFamilies is a list of IP families (e.g. IPv4, IPv6) assigned to a service. This field is usually assigned automatically
  # based on cluster configuration and the ipFamilyPolicy field. [IPv4/IPv6 dual-stack](https://kubernetes.io/docs/concepts/services-networking/dual-stack).
  ipFamilies:
  - IPv4

ingress:
  # -- Indicates whether or not an Ingress resource is created.
  enabled: true
  # -- className is the name of the Ingress class.
  className: traefik
  # -- annotations to be added to the Ingress resource.
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"

  hosts:
    - # -- host is the hostname of a request that must match exactly or use a wildcard as the subdomain.
      host: "keycloak.127.0.0.1.sslip.io"
      paths:
        - # -- path is part of a list of one or more paths that are associated with a backend service.
          path: /
          # -- pathType is a field that can specify how Ingress paths should be matched.
          # Reference [Path types](https://kubernetes.io/docs/concepts/services-networking/ingress/#path-types).
          pathType: Prefix
  # -- tls is a list of hosts that needs to explicitly match the host in the rules section.
  # It also contains a secret with references to tls.crt and tls.key to use for TLS.
  tls: []
  # - secretName: chart-example-tls
  #   hosts:
  #   - chart-example.local

# -- Optionally request and limit how much CPU and memory (RAM) the container needs.
# Reference [Resource Management for Pods and Containers](https://kubernetes.io/docs/concepts/configuration/manage-resources-containers).
resources: {}
  #  We usually recommend not to specify default resources and to leave this as a conscious
  #  choice for the user. This also increases chances charts run on environments with little
  #  resources, such as Minikube. If you do want to specify resources, uncomment the following
  #  lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # requests:
  #   memory: 256Mi
  #   cpu: 500m
  # limits:
  #   memory: 512Mi
  #   cpu: 1000m

networkPolicy:
  # -- Specifies whether a network policy should be created. By default, the operator automatically creates a NetworkPolicy
  # resource to deny access to the clustering port of the Keycloak Pods. The HTTP(S) endpoint is open to traffic from any
  # namespace and the outside world.
  # Note: This will have no effect unless the chosen CNI supports network policies like Calico, Weave, Cilium, Romana, etc.
  enabled: true
  # -- http is a list of source rules which should be able to access this endpoint (port 8080 by default). Items in this list
  # are combined using a logical OR operation. If this field is empty or missing, this rule matches all sources (traffic not
  # restricted by source). If this field is present and contains at least one item, this rule allows traffic only if the traffic
  # matches at least one item in the from list. Due to security reasons, the HTTP endpoint is disabled by default, unless
  # `devModeEnabled` is set to `true`.
  # Reference [Behavior of to and from selectors](https://kubernetes.io/docs/concepts/services-networking/network-policies/#behavior-of-to-and-from-selectors).
  http: []
  # - ipBlock:
  #     cidr: 172.17.0.0/16
  #     except:
  #     - 172.17.1.0/24
  # - namespaceSelector:
  #     matchLabels:
  #       project: my-project
  #   podSelector:
  #     matchLabels:
  #       role: client
  # - podSelector: {}

  # -- https is a list of source rules which should be able to access this endpoint (port 8443 by default). Items in this list
  # are combined using a logical OR operation. If this field is empty or missing, this rule matches all sources (traffic not
  # restricted by source). If this field is present and contains at least one item, this rule allows traffic only if the traffic
  # matches at least one item in the from list.
  # Reference [Behavior of to and from selectors](https://kubernetes.io/docs/concepts/services-networking/network-policies/#behavior-of-to-and-from-selectors).
  https: []
  # - ipBlock:
  #     cidr: 172.17.0.0/16
  #     except:
  #     - 172.17.1.0/24
  # - namespaceSelector:
  #     matchLabels:
  #       project: my-project
  #   podSelector:
  #     matchLabels:
  #       role: client
  # - podSelector: {}

  # -- management is a list of source rules which should be able to access this endpoint (port 9000 by default). Items in this list
  # are combined using a logical OR operation. If this field is empty or missing, this rule matches all sources (traffic not
  # restricted by source). If this field is present and contains at least one item, this rule allows traffic only if the traffic
  # matches at least one item in the from list.
  # Reference [Behavior of to and from selectors](https://kubernetes.io/docs/concepts/services-networking/network-policies/#behavior-of-to-and-from-selectors).
  management: []
  # - namespaceSelector:
  #     # Another less intuitive approach still matching based on labels since matching by namespace name is not supported directly.
  #     matchExpressions:
  #     - key: namespace
  #       operator: In
  #       values: ["frontend", "backend"]
  # - namespaceSelector:
  #     # Kubernetes 1.22+ sets an immutable label with the namespace name provided that the NamespaceDefaultLabelName feature gate is enabled.
  #     matchLabels:
  #       kubernetes.io/metadata.name: default

# -- secrets is used to store confidential data in key-value pairs.
# Quoting is required if the value is 0.
secrets:
  # TODO: add something here or make a custom secret.
  foo: bar

keycloakOperator:
  # -- Indicates whether or not the Keycloak Operator is installed.
  enabled: true
  watchAllNamespacesFor:
    # -- keycloak is for indicating whether or not Keycloak resources will be watched
    # in all namespaces.
    keycloak: false
    # -- keycloakRealmImport is for indicating whether or not KeycloakRealmImport
    # resources will be watched in all namespaces.
    keycloakRealmImport: false
    # -- keycloakOIDCClient is for indicating whether or not KeycloakOIDCClient
    # resources will be watched in all namespaces.
    keycloakOIDCClient: false
    # -- keycloakSAMLClient is for indicating whether or not KeycloakSAMLClient
    # resources will be watched in all namespaces.
    keycloakSAMLClient: false

postgresql:
  # -- Indicates whether or not a PostgreSQL database is created.
  enabled: true
  # @ignored. Override for postgresql chart name in helm common labels.
  nameOverride: "keycloak-postgresql"
  auth:
    # -- username is the username for the database user.
    username: postgres
    # -- password is the password for the database user. If unset, a random password
    # is generated and stored in a secret.
    password: ""
    # -- database is the name of the database to use for Keycloak.
    database: keycloak