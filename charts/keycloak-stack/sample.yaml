spec:
  replicas: 1
  serviceName: example-keycloak-postgresql-hl
  updateStrategy:
    rollingUpdate: {}
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/instance: example
      app.kubernetes.io/name: keycloak-postgresql
      app.kubernetes.io/component: primary
  template:
    metadata:
      name: example-keycloak-postgresql
      labels:
        app.kubernetes.io/instance: example
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: keycloak-postgresql
        app.kubernetes.io/version: 18.4.0
        helm.sh/chart: postgresql-18.8.0
        app.kubernetes.io/component: primary
    spec:
      serviceAccountName: example-keycloak-postgresql
      
      automountServiceAccountToken: false
      affinity:
        podAffinity:
          
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/instance: example
                    app.kubernetes.io/name: keycloak-postgresql
                    app.kubernetes.io/component: primary
                topologyKey: kubernetes.io/hostname
              weight: 1
        nodeAffinity:
          
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: Always
        supplementalGroups: []
        sysctls: []
      hostNetwork: false
      hostIPC: false
      containers:
        - name: postgresql
          image: registry-1.docker.io/bitnami/postgresql:latest
          imagePullPolicy: "IfNotPresent"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsGroup: 1001
            runAsNonRoot: true
            runAsUser: 1001
            seLinuxOptions: {}
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: BITNAMI_DEBUG
              value: "false"
            - name: POSTGRESQL_PORT_NUMBER
              value: "5432"
            - name: POSTGRESQL_VOLUME_DIR
              value: "/bitnami/postgresql"
            - name: OPENSSL_FIPS
              value: "yes"
            - name: OPENSSL_FIPS_PROVIDER_PATH
              value: "/etc/ssl/provider_fips.cnf"
            - name: PGDATA
              value: "/bitnami/postgresql/data"
            # Authentication
            - name: POSTGRES_PASSWORD_FILE
              value: /opt/bitnami/postgresql/secrets/postgres-password
            - name: POSTGRES_DATABASE
              value: "keycloak"
            # LDAP
            - name: POSTGRESQL_ENABLE_LDAP
              value: "no"
            # TLS
            - name: POSTGRESQL_ENABLE_TLS
              value: "no"
            # Audit
            - name: POSTGRESQL_LOG_HOSTNAME
              value: "false"
            - name: POSTGRESQL_LOG_CONNECTIONS
              value: "false"
            - name: POSTGRESQL_LOG_DISCONNECTIONS
              value: "false"
            - name: POSTGRESQL_PGAUDIT_LOG_CATALOG
              value: "off"
            # Others
            - name: POSTGRESQL_CLIENT_MIN_MESSAGES
              value: "error"
            - name: POSTGRESQL_SHARED_PRELOAD_LIBRARIES
              value: "pgaudit"
          ports:
            - name: tcp-postgresql
              containerPort: 5432
          livenessProbe:
            failureThreshold: 6
            initialDelaySeconds: 30
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
            exec:
              command:
                - /bin/sh
                - -ec
                - |
                  exec pg_isready -U "postgres" -d "dbname=keycloak" -h 127.0.0.1 -p 5432
          readinessProbe:
            failureThreshold: 6
            initialDelaySeconds: 5
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
            exec:
              command:
                - /bin/sh
                - -ec
                - |
                  exec pg_isready -U "postgres" -d "dbname=keycloak" -h 127.0.0.1 -p 5432
                  [ -f /opt/bitnami/postgresql/tmp/.initialized ] || [ -f /bitnami/postgresql/.initialized ]
          resources:
            limits:
              cpu: 150m
              ephemeral-storage: 2Gi
              memory: 192Mi
            requests:
              cpu: 100m
              ephemeral-storage: 50Mi
              memory: 128Mi
          volumeMounts:
            - name: empty-dir
              mountPath: /tmp
              subPath: tmp-dir
            - name: empty-dir
              mountPath: /opt/bitnami/postgresql/conf
              subPath: app-conf-dir
            - name: empty-dir
              mountPath: /opt/bitnami/postgresql/tmp
              subPath: app-tmp-dir
            - name: postgresql-password
              mountPath: /opt/bitnami/postgresql/secrets/
            - name: dshm
              mountPath: /dev/shm
            - name: data
              mountPath: /bitnami/postgresql
      volumes:
        - name: empty-dir
          emptyDir: {}
        - name: postgresql-password
          secret:
            secretName: example-keycloak-postgresql
        - name: dshm
          emptyDir:
            medium: Memory
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
      spec:
        accessModes:
          - "ReadWriteOnce"
        resources:
          requests:
            storage: "8Gi"
---
# Source: keycloak-stack/templates/keycloak.yaml
apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: example-keycloak-stack
  labels:
    helm.sh/chart: keycloak-stack-0.1.0
    app.kubernetes.io/name: keycloak-stack
    app.kubernetes.io/instance: example
    app.kubernetes.io/version: "26.7.0"
    app.kubernetes.io/managed-by: Helm
  namespace: default
spec:
  instances: 1
  startOptimized: false
  bootstrapAdmin:
    user:
      secret: example-keycloak-stack-secret
  db:
    vendor: postgres
    host: example-keycloak-postgresql-hl.default.svc.cluster.local
    database: keycloak
    port: 5432
    usernameSecret:
      name: example-keycloak-stack-secret
      key: db-username
    passwordSecret:
      name: example-keycloak-postgresql
      key: postgres-password
    schema: public
    poolInitialSize: 1
    poolMinSize: 2
    poolMaxSize: 30
  transaction:
    xaEnabled: false
  http:
    httpEnabled: false
    httpPort: 8080
    httpsPort: 8443
  hostname:
    hostname: keycloak.127.0.0.1.sslip.io
    strict: true
    backchannelDynamic: false
  automountServiceAccountToken: true
  ingress:
    enabled: true
  httpManagement:
    port: 9000
  update:
    strategy: RecreateOnImageChange
  networkPolicy:
    enabled: true
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
  tracing:
    enabled: false
    compression: none
    endpoint: http://otel-collector:4317
    protocol: grpc
    samplerRatio: 0.1
    samplerType: traceidratio
  telemetry:
    enabled: false
    endpoint: http://otel-collector:4317
    serviceName: ""
  additionalOptions:
    - name: metrics-enabled
      value: "false"
    - name: telemetry-metrics-enabled
      value: "false"
