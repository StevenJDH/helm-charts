{{/*
Generates a CRD delete Job that is compatible with all supported Kubernetes API versions.

Usage:
include "shared-library._crd-delete-job" (dict
  "context" .
  "config" .Values.crds
)

NOTE: This internal specialty template does not support overriding.

Params:
  - context - Dict - Required. The top-level context for the template evaluation.
  - config - Dict - Required. The context for the 'crds' config section.
*/}}

{{- define "shared-library._crd-delete-job" -}}
{{- $ctx     := .context                   -}}
{{- $config  := .config                    -}}
{{- $busybox := $config.upgradeJob.busybox -}}
{{- $kubectl := $config.upgradeJob.kubectl -}}
{{- if $config.deleteOnUninstall -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "shared-library.fullname" $ctx }}-crd-delete
  annotations:
    "helm.sh/hook": post-delete
    "helm.sh/hook-weight": "-0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    {{- include "shared-library.labels" $ctx | nindent 4 }}
  namespace: {{ $ctx.Release.Namespace }}
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "shared-library.selectorLabels" $ctx | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "shared-library.fullname" $ctx }}-crd-delete
      initContainers:
        - name: extract-crds
          image: "{{ $busybox.image.repository }}:{{ $busybox.image.tag | default "latest" }}"
          imagePullPolicy: {{ $busybox.image.pullPolicy | default "IfNotPresent" }}
          command:
            - tar
          args:
            - -xzf
            - /input/crds.tar.gz
            - -C
            - /crds
          volumeMounts:
            - name: crd-archive
              mountPath: /input
              readOnly: true
            - name: crds
              mountPath: /crds
          {{- with $busybox.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      containers:
        - name: kubectl
          {{- $defaultKubernetesVersion := (ternary
            (printf "%s.0" $ctx.Capabilities.KubeVersion.Version)
            (regexFind "v\\d+\\.\\d+\\.\\d+" $ctx.Capabilities.KubeVersion.Version)
            (regexMatch "^v\\d+\\.\\d+$" $ctx.Capabilities.KubeVersion.Version)
          ) }}
          image: "{{ $kubectl.image.repository }}:{{ $kubectl.image.tag | default $defaultKubernetesVersion }}"
          imagePullPolicy: {{ $kubectl.image.pullPolicy | default "IfNotPresent" }}
          command:
            - kubectl
          args:
            - delete
            - --ignore-not-found
            - -f
            - /crds
          {{- with $kubectl.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: crds
              mountPath: /crds
              readOnly: true
      volumes:
        - name: crd-archive
          configMap:
            name: {{ include "shared-library.fullname" $ctx }}-crds
        - name: crds
          emptyDir: {}
{{- end }}
{{- end -}}