{{/*
Generates a ClusterRoleBinding for a CRD delete Job that is compatible with all supported
Kubernetes API versions.

Usage:
include "shared-library.crd-delete-clusterrolebinding" (dict
  "context" .
  "config" .Values.crds
)

OR

{{- include "shared-library.crd-delete-clusterrolebinding" (dict
  "context" .
  "config" .Values.crds
  "override" "override.crd-delete-clusterrolebinding"
) }}

{{- define "override.crd-delete-clusterrolebinding" -}}
{{- $ctx := .context -}}
metadata:
  labels:
    foo: bar
    {{- include "shared-library.labels" $ctx | nindent 4 }}
{{- end -}}

NOTE: This template is meant to be used by the 'shared-library.crd-delete-orchestrator'
      template, which wraps the four needed templates into one. If customization is
      needed, then do not use the orchestrator.

Params:
  - context - Dict - Required. The top-level context for the template evaluation.
  - config - Dict - Required. The context for the 'crds' config section.
  - override - String - Optional. Definition to merge into the included template.
*/}}

{{- define "shared-library.crd-delete-clusterrolebinding.tpl" -}}
{{- $ctx    := .context -}}
{{- $config := .config  -}}
{{- if $config.deleteJob.enabled -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "shared-library.fullname" $ctx }}-crd-delete
  annotations:
    "helm.sh/hook": post-delete
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    {{- include "shared-library.labels" $ctx | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "shared-library.fullname" $ctx }}-crd-delete
subjects:
  - kind: ServiceAccount
    name: {{ include "shared-library.fullname" $ctx }}-crd-delete
    namespace: {{ $ctx.Release.Namespace }}
{{- end }}
{{- end -}}

{{- define "shared-library.crd-delete-clusterrolebinding" -}}
{{- if and (kindIs "map" .) (hasKey . "override") .override }}
  {{- $ctx := omit . "override" -}}
  {{- include "shared-library.util.merge" (list $ctx .override "shared-library.crd-delete-clusterrolebinding.tpl") }}
{{- else -}}
  {{- include "shared-library.crd-delete-clusterrolebinding.tpl" . }}
{{- end }}
{{- end -}}