{{/*
Generates a set of resources for upgrading CRDs that are compatible with all supported
Kubernetes API versions.

Usage:
include "shared-library.crd-upgrade-orch" (dict
  "context" .
  "config" .Values.crds
)

The consuming chart must provide:
- crds/*.yaml or crds/*.yml, OR a static list of CRD resource names.
- files/crds.tar.gz

NOTE: This specialty orchestration template does not support overriding.

Params:
  - context - Dict - Required. The top-level context for the template evaluation.
  - config - Dict - Required. The context for the 'crds' config section.
*/}}

{{- define "shared-library.crd-upgrade-orch" -}}
{{- $config := .config  -}}
{{- if $config.upgradeJob.enabled -}}
{{ include "shared-library.crd-configmap.tpl" . }}
---
{{ include "shared-library.crd-upgrade-serviceaccount.tpl" . }}
---
{{ include "shared-library.crd-upgrade-clusterrole.tpl" . }}
---
{{ include "shared-library.crd-upgrade-clusterrolebinding.tpl" . }}
---
{{ include "shared-library.crd-upgrade-job.tpl" . }}
{{- end }}
{{- end -}}