{{/*
Generates a ConfigMap for CRD upgrade and delete Jobs that are compatible with all
supported Kubernetes API versions.

Usage:
include "shared-library.crd-configmap" (dict
  "context" .
  "config" .Values.crds
)

OR

{{- include "shared-library.crd-configmap" (dict
  "context" .
  "config" .Values.crds
  "override" "override.crd-configmap"
) }}

{{- define "override.crd-configmap" -}}
{{- $ctx := .context -}}
metadata:
  labels:
    foo: bar
    {{- include "shared-library.labels" $ctx | nindent 4 }}
{{- end -}}

The consuming chart must provide:
- files/crds.tar.gz

NOTE: This template is meant to be used by the 'shared-library.crd-upgrade-orch'
      and 'shared-library.crd-delete-orch' templates, which wrap the five needed
      templates into one, respectively. If customization is needed, then do not
      use the orchestrators.

Params:
  - context - Dict - Required. The top-level context for the template evaluation.
  - config - Dict - Required. The context for the 'crds' config section.
  - override - String - Optional. Definition to merge into the included template.
*/}}

{{- define "shared-library.crd-configmap.tpl" -}}
{{- $ctx    := .context -}}
{{- $config := .config  -}}
{{- if or $config.upgradeJob.enabled $config.deleteJob.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "shared-library.fullname" $ctx }}-crds
  annotations:
    "helm.sh/hook": pre-upgrade,pre-rollback,post-delete
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    {{- include "shared-library.labels" $ctx | nindent 4 }}
  namespace: {{ $ctx.Release.Namespace }}
binaryData:
  crds.tar.gz: {{ $ctx.Files.Get "files/crds.tar.gz" | b64enc }}
{{- end }}
{{- end -}}

{{- define "shared-library.crd-configmap" -}}
{{- if and (kindIs "map" .) (hasKey . "override") .override }}
  {{- $ctx := omit . "override" -}}
  {{- include "shared-library.util.merge" (list $ctx .override "shared-library.crd-configmap.tpl") }}
{{- else -}}
  {{- include "shared-library.crd-configmap.tpl" . }}
{{- end }}
{{- end -}}