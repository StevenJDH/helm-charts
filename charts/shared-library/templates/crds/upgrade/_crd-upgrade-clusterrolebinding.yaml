{{/*
Generates a ClusterRoleBinding for a CRD upgrade Job that is compatible with all supported
Kubernetes API versions.

Usage:
include "shared-library._crd-upgrade-clusterrolebinding" (dict
  "context" .
  "config" .Values.crds
)

NOTE: This internal specialty template does not support overriding.

Params:
  - context - Dict - Required. The top-level context for the template evaluation.
  - config - Dict - Required. The context for the 'crds' config section.
*/}}

{{- define "shared-library._crd-upgrade-clusterrolebinding" -}}
{{- $ctx    := .context -}}
{{- $config := .config  -}}
{{- if $config.upgradeJob.enabled -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "shared-library.fullname" $ctx }}-crd-upgrade
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade,pre-rollback
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    {{- include "shared-library.labels" $ctx | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "shared-library.fullname" $ctx }}-crd-upgrade
subjects:
  - kind: ServiceAccount
    name: {{ include "shared-library.fullname" $ctx }}-crd-upgrade
    namespace: {{ $ctx.Release.Namespace }}
{{- end }}
{{- end -}}