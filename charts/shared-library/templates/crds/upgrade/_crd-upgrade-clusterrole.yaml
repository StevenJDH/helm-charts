{{/*
Generates a ClusterRole for a CRD upgrade Job that is compatible with all supported
Kubernetes API versions.

Usage:
{{- include "shared-library.crd-upgrade-clusterrole" . }}

OR

{{- include "shared-library.crd-upgrade-clusterrole" (dict
  "context" .
  "config" .Values.crds
) }}

OR

{{- include "shared-library.crd-upgrade-clusterrole" (dict
  "context" .
  "config" .Values.crds
  "override" "override.crd-upgrade-clusterrole"
) }}

{{- define "override.crd-upgrade-clusterrole" -}}
{{- $ctx := .context -}}
metadata:
  labels:
    foo: bar
    {{- include "shared-library.labels" $ctx | nindent 4 }}
{{- end -}}

The consuming chart must provide:
- crds/*.yaml or crds/*.yml, OR a static list of CRD resource names.

NOTE: This template is meant to be used by the 'shared-library.crd-upgrade-orch'
      template, which wraps the five needed templates into one. If customization
      is needed, then do not use the orchestrator.

Params:
  - context - Dict - Required. The top-level context for the template evaluation.
  - config - Dict - Required. The context for the 'crds' config section.
  - override - String - Optional. Definition to merge into the included template.
*/}}

{{- define "shared-library.crd-upgrade-clusterrole.tpl" -}}
{{- $ctx    := .context -}}
{{- $config := .config  -}}
{{- if $config.upgradeJob.enabled -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "shared-library.fullname" $ctx }}-crd-upgrade
  annotations:
    "helm.sh/hook": pre-upgrade,pre-rollback
    "helm.sh/hook-weight": "-15"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    {{- include "shared-library.labels" $ctx | nindent 4 }}
rules:
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - list
      - create
      - update
      - patch
    resourceNames:
  {{- if $config.resourceNamesOverride  }}
    {{- range $name := $config.resourceNamesOverride }}
      {{- if not (trim $name) }}
        {{- fail "The 'crds.resourceNamesOverride' list cannot contain empty entries." }}
      {{- end }}
      - {{ $name | quote }}
    {{- end }}
  {{- else }}
    {{- $patterns := list "crds/*.yaml" "crds/*.yml" }}
    {{- $found := false }}
    {{- range $pattern := $patterns }}
      {{- range $path, $_ := $ctx.Files.Glob $pattern }}
        {{- $found = true }}
      - {{ ($ctx.Files.Get $path | fromYaml).metadata.name }}
      {{- end }}
    {{- end }}
    {{- if not $found }}
      {{- fail "No CRD files found under 'crds/*.yaml' or 'crds/*.yml'." }}
    {{- end }}
  {{- end }}
{{- end }}
{{- end -}}

{{- define "shared-library.crd-upgrade-clusterrole" -}}
{{- if and (kindIs "map" .) (eq (len .) 3) (hasKey . "override") .override }}
  {{- $ctx := omit . "override" -}}
  {{- include "shared-library.util.merge" (list $ctx .override "shared-library.crd-upgrade-clusterrole.tpl") }}
{{- else if and (kindIs "map" .) (eq (len .) 2) (hasKey . "config") -}}
  {{- include "shared-library.crd-upgrade-clusterrole.tpl" . }}
{{- else -}}
  {{- include "shared-library.crd-upgrade-clusterrole.tpl" (dict
    "context" .
    "config" .Values.crds
  ) }}
{{- end }}
{{- end -}}