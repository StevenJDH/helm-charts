{{/*
Generates a ServiceAccount for a CRD upgrade Job that is compatible with all supported
Kubernetes API versions.

Usage:
include "shared-library.crd-upgrade-serviceaccount" (dict
  "context" .
  "config" .Values.crds
)

OR

{{- include "shared-library.crd-upgrade-serviceaccount" (dict
  "context" .
  "config" .Values.crds
  "override" "override.crd-upgrade-serviceaccount"
) }}

{{- define "override.crd-upgrade-serviceaccount" -}}
{{- $ctx := .context -}}
metadata:
  labels:
    foo: bar
    {{- include "shared-library.labels" $ctx | nindent 4 }}
{{- end -}}

NOTE: This template is meant to be used by the 'shared-library.crd-upgrade-orch'
      template, which wraps the five needed templates into one. If customization
      is needed, then do not use the orchestrator.

Params:
  - context - Dict - Required. The top-level context for the template evaluation.
  - config - Dict - Required. The context for the 'crds' config section.
  - override - String - Optional. Definition to merge into the included template.
*/}}

{{- define "shared-library.crd-upgrade-serviceaccount.tpl" -}}
{{- $ctx    := .context -}}
{{- $config := .config  -}}
{{- if $config.upgradeJob.enabled -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "shared-library.fullname" $ctx }}-crd-upgrade
  annotations:
    "helm.sh/hook": pre-upgrade,pre-rollback
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    {{- include "shared-library.labels" $ctx | nindent 4 }}
  namespace: {{ $ctx.Release.Namespace }}
{{- end }}
{{- end -}}

{{- define "shared-library.crd-upgrade-serviceaccount" -}}
{{- if and (kindIs "map" .) (hasKey . "override") .override }}
  {{- $ctx := omit . "override" -}}
  {{- include "shared-library.util.merge" (list $ctx .override "shared-library.crd-upgrade-serviceaccount.tpl") }}
{{- else -}}
  {{- include "shared-library.crd-upgrade-serviceaccount.tpl" . }}
{{- end }}
{{- end -}}