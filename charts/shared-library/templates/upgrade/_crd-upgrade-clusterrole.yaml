{{/*
Generates a ClusterRole for a CRD upgrade Job that is compatible with all supported
Kubernetes API versions.

Usage:
include "shared-library._crd-upgrade-clusterrole" (dict
  "context" .
  "config" .Values.crds
)

The consuming chart must provide:
- crds/*.yaml or crds/*.yml

NOTE: This internal specialty template does not support overriding.

Params:
  - context - Dict - Required. The top-level context for the template evaluation.
  - config - Dict - Required. The context for the 'crds' config section.
*/}}

{{- define "shared-library._crd-upgrade-clusterrole" -}}
{{- $ctx    := .context -}}
{{- $config := .config  -}}
{{- if $config.upgradeJob.enabled -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "shared-library.fullname" $ctx }}-crd-upgrade
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade,pre-rollback
    "helm.sh/hook-weight": "-15"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    {{- include "shared-library.labels" $ctx | nindent 4 }}
rules:
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - list
      - create
      - update
      - patch
    resourceNames:
    {{- $patterns := list "crds/*.yaml" "crds/*.yml" }}
    {{- $found := false }}
    {{- range $pattern := $patterns }}
      {{- range $path, $_ := $ctx.Files.Glob $pattern }}
        {{- $found = true }}
      - {{ ($ctx.Files.Get $path | fromYaml).metadata.name }}
      {{- end }}
    {{- end }}
    {{- if not $found }}
      {{- fail "No CRD files found under crds/*.yaml or crds/*.yml" }}
    {{- end }}
{{- end }}
{{- end -}}