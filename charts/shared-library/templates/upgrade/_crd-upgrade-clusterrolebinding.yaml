{{/*
Generate ClusterRoleBinding for a CRD upgrade Job.

Expected input:

  include "shared-library._crd-upgrade-clusterrolebinding" (dict
    "context" .
    "config" .Values.crds
  )
*/}}
{{- define "shared-library._crd-upgrade-clusterrolebinding" -}}
{{- $ctx    := .context -}}
{{- $config := .config  -}}
{{- if $config.upgradeJob.enabled -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "shared-library.fullname" $ctx }}-crd-upgrade
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade,pre-rollback
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    {{- include "shared-library.labels" $ctx | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "shared-library.fullname" $ctx }}-crd-upgrade
subjects:
  - kind: ServiceAccount
    name: {{ include "shared-library.fullname" $ctx }}-crd-upgrade
    namespace: {{ $ctx.Release.Namespace }}
{{- end }}
{{- end -}}