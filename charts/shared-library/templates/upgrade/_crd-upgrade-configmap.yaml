{{/*
Create the compressed CRD archive ConfigMap.

Expected input:

  include "shared-library._crd-upgrade-configmap" (dict
    "context" .
    "config" .Values.crds
  )

The consuming chart must provide:

  files/crds.tar.gz
*/}}
{{- define "shared-library._crd-upgrade-configmap" -}}
{{- $ctx    := .context -}}
{{- $config := .config  -}}

{{- if $config.upgradeJob.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "shared-library.fullname" $ctx }}-crds
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade,pre-rollback
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    {{- include "shared-library.labels" $ctx | nindent 4 }}
  namespace: {{ $ctx.Release.Namespace }}
binaryData:
  crds.tar.gz: {{ $ctx.Files.Get "files/crds.tar.gz" | b64enc }}
{{- end }}
{{- end -}}