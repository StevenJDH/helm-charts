# Source: example/templates/crds/crd-delete.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: example-crd-delete
  annotations:
    "helm.sh/hook": post-delete
    "helm.sh/hook-weight": "-0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    helm.sh/chart: example-0.2.0
    app.kubernetes.io/name: example
    app.kubernetes.io/instance: example
    app.kubernetes.io/version: "1.25.4"
    app.kubernetes.io/managed-by: Helm
  namespace: default
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: example
        app.kubernetes.io/instance: example
    spec:
      restartPolicy: OnFailure
      serviceAccountName: example-crd-delete
      initContainers:
        - name: extract-crds
          image: "busybox:1.38"
          imagePullPolicy: IfNotPresent
          command:
            - tar
          args:
            - -xzf
            - /input/crds.tar.gz
            - -C
            - /crds
          volumeMounts:
            - name: crd-archive
              mountPath: /input
              readOnly: true
            - name: crds
              mountPath: /crds
      containers:
        - name: kubectl
          image: "registry.k8s.io/kubectl:v1.30.0"
          imagePullPolicy: IfNotPresent
          command:
            - kubectl
          args:
            - delete
            - --ignore-not-found
            - -f
            - /crds
          volumeMounts:
            - name: crds
              mountPath: /crds
              readOnly: true
      volumes:
        - name: crd-archive
          configMap:
            name: example-crds
        - name: crds
          emptyDir: {}
---
