kafka:
  rackTopology:
    enabled: false
  logging:
    type: inline
    loggers:
      rootLogger.level: "INFO"
      logger.orgapachekafka.level: "INFO"
      logger.kafka.level: "INFO"
      logger.authorizer.level: "INFO"
  listeners:
    - name: plain
      port: 9092
      type: internal
      tls: false
    - name: tls
      port: 9094
      type: internal
      tls: true
      authentication:
        type: tls
      configuration:
        useServiceDnsDomain: true
    - name: clusterip
      port: 9196
      type: cluster-ip
      tls: true
      authentication:
        type: tls
      configuration:
        useServiceDnsDomain: true
        # Route to bootstrap service should be configured separately via the chosen ingress mechanism.
        advertisedHostTemplate: mtls-broker-{nodeId}.kafka.127.0.0.1.sslip.io
        advertisedPortTemplate: "443"
        # Clients need to trust CA extracted with below command or specify a custom cert chain
        # as per below commented out section.
        # openssl s_client -connect mtls-broker-0.kafka.127.0.0.1.sslip.io:443 -servername mtls-broker-0.kafka.127.0.0.1.sslip.io -showcerts
        # kubectl get secret <cluster-name>-cluster-ca-cert -o jsonpath='{.data.ca\.crt}' -n strimzi | base64 -d > ca.crt
        # brokerCertChainAndKey:
        #   # kubectl create secret tls my-tls-secret --cert=path/to/tls.crt --key=path/to/tls.key -n strimzi
        #   secretName: my-tls-secret
        #   certificate: tls.crt
        #   key: tls.key
  authorization:
    type: simple
  clusterCa:
    generateSecretOwnerReference: true
  clientsCa:
    generateSecretOwnerReference: true

podMonitor:
  create: false
  labels:
    release: kube-prometheus-stack

scrapeConfigHeadlessServices:
  create: false

prometheusKafkaAlerts:
  create: false

nodePools:
  broker:
    enabled: false
    annotations:
      strimzi.io/next-node-ids: "[0-10]"
  kraft-controller:
    enabled: false
    annotations:
      strimzi.io/next-node-ids: "[11-20]"
  dual-role-broker:
    enabled: true

testResources:
  create: true

k6:
  loadTestScripts:
    create: true
  dashboard:
    enabled: true

crds:
  upgradeJob:
    enabled: true
  deleteJob:
    enabled: true

strimzi-kafka-operator:
  dashboards:
    enabled: true

strimzi-drain-cleaner:
  enabled: false
  certManager:
    create: false
