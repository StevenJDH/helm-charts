deployment:
  replicas: 1

service:
  type: LoadBalancer

ports:
  traefik:
    port: 8000
    expose:
      default: false

  web:
    port: 80
    expose:
      default: true

  websecure:
    port: 443
    expose:
      default: true

providers:
  kubernetesCRD:
    enabled: true
  kubernetesGateway:
    enabled: true
  kubernetesIngress:
    enabled: true
  # For those still using using nginx ingress controller and
  # or not ready to move to Gateway API or another solution,
  # then enable this. Make sure not to mix approaches when
  # defining a resource to point to the same endpoint.
  # Reference: https://doc.traefik.io/traefik/master/reference/routing-configuration/kubernetes/ingress-nginx/
  kubernetesIngressNGINX:
    enabled: false

api:
  dashboard: true
  insecure: true
